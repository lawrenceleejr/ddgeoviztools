<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07080a" />
    <title>MAIA — the detector, taken apart</title>
    <meta name="description" content="A scroll-driven exploded view of the MAIA muon-collider detector, built from its DD4hep geometry." />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="stage" aria-hidden="true">
      <canvas id="gl"></canvas>
      <div id="labels"></div>
      <svg id="leaders" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <div id="loader" role="status" aria-live="polite">
      <div class="loader-name">MAIA</div>
      <div class="loader-bar"><div class="loader-fill"></div></div>
      <div class="loader-note">Loading geometry</div>
    </div>

    <main id="story">
      <!-- Chapters are generated from src/chapters.js so copy and camera live together. -->
    </main>

    <noscript>
      <p class="noscript">This page needs JavaScript and WebGL to show the MAIA detector.</p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
