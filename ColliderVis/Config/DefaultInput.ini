[/Script/Engine.InputSettings]
; Disable all legacy input — Enhanced Input only
bEnableLegacyActionMappings=False
bEnableLegacyAxisMappings=False
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
; Mouse-look in fullscreen: lock the cursor to the viewport ALWAYS and capture it
; permanently, so the OS cursor can't escape to the screen edge (which zeroed the
; mouse delta in fullscreen and broke look). Fixes fullscreen mouse movement.
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockAlways
