; ── Project renderer defaults (set via Project Settings → Rendering) ────────

[/Script/Engine.RendererSettings]
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=True
r.Lumen.Enabled=1
r.Lumen.Reflections.Allow=1
; Only trace Lumen reflections on smoother surfaces (was 1.0 = every surface, costly);
; rough detector/hall surfaces fall back to cheaper reflections. Big FPS win, minimal look change.
r.Lumen.Reflections.MaxRoughnessToTrace=0.4
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.TranslucencyReflections.FrontLayer.Enable=1
r.Lumen.DiffuseIndirect.Allow=1
; Cheaper Lumen GI final gather (was 16; higher = fewer screen probes = faster).
r.Lumen.ScreenProbeGather.DownsampleFactor=24
r.Lumen.TraceMeshSDFs=1
; REALTIME = software Lumen (Mesh-SDF tracing above) for fast in-editor/PIE FPS.
; Hardware ray tracing is enabled per-render for OFFLINE Movie Render Queue output
; only — see the RAY TRACING block below and Tools/render_lumen_mrq.sh.
r.Lumen.HardwareRayTracing=0
r.GenerateMeshDistanceFields=True
r.SkyAtmosphere=1
r.VolumetricFog=1
; Volumetric fog froxel grid coarsened from 4 -> 14 px (the god-ray was the
; single most expensive per-frame effect at 4); GridSizeZ 128 -> 64. Still soft, much cheaper.
r.VolumetricFog.GridPixelSize=14
r.VolumetricFog.GridSizeZ=64
r.VolumetricFog.HistoryWeight=0.9
r.Shadow.Virtual.Enable=1
r.AntiAliasingMethod=4
r.TemporalAA.Algorithm=1
r.TSR.History.ScreenPercentage=200
; Render at 75% internal res and let TSR upscale — typically the biggest single FPS
; lever with minimal perceptible quality loss at this output size.
r.ScreenPercentage=75
; Path tracer OFF in the realtime defaults (it would force RT pipeline compiles at
; startup for no in-game benefit). Offline path-traced renders enable it per-process
; via -dpcvars in Tools/render_lumen_mrq.sh (the path tracer needs r.RayTracing=1).
r.PathTracing=0
r.PathTracing.MaxBounces=12
r.PathTracing.SamplesPerPixel=64
r.PostProcessAAQuality=6
r.DepthOfField.Method=2
r.LensFlare=1
r.BloomQuality=5
r.MotionBlur.Max=0.15
r.MotionBlur.Amount=0.5
r.SceneColorFringe.Max=5
r.TonemapperFilm=1

; ── Engine settings ──────────────────────────────────────────────────────────
r.SkinCache.CompileShaders=1
; ── RAY TRACING — REALTIME OFF, OFFLINE-ONLY (Metal / Apple Silicon) ─────────
; Design: ray tracing is OFF in the always-on project defaults so the editor
; viewport, PIE and any shipped game run fast (software Lumen + raster). The whole
; RT pipeline is heavy on Metal and would force startup PSO compiles + per-frame
; BVH builds we don't want interactively.
;
; OFFLINE high-quality stills/animations DO use ray tracing / the path tracer.
; That runs in a SEPARATE headless -game process (Tools/render_lumen_mrq.sh) which
; turns the pipeline on at startup with:
;     -dpcvars="r.RayTracing=1,r.RayTracing.Shadows=1,r.Lumen.HardwareRayTracing=1"
; (plus the MRQ config asset's ConsoleVariableSetting from Tools/make_mrq_config.py).
; r.RayTracing is a startup/read-only cvar, so it must be set via -dpcvars at launch,
; not -ExecCmds. Keep these False here — flipping them on is what slowed the game.
r.RayTracing=False
r.RayTracing.Shadows=False

[/Script/Engine.Engine]
