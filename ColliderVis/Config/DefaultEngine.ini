; ── Console variable overrides (CVars) ───────────────────────────────────────

[SystemSettings]
; VR pixel density: 1.0 = native Quest 3 resolution (2064×2208 per eye).
; Raise to 1.2 for PCVR supersampling; lower to 0.9 to reclaim standalone perf.
vr.PixelDensity=1.0

; NOTE: Nanite is intentionally NOT forced on here. The detector meshes were
; simplified (2026-06-20: ~4.43M → ~415k tris total via data/output reimport), so
; they rasterize cheaply without Nanite. (The engine defaults r.Nanite=0 on Metal
; anyway.) If a future asset ever needs Nanite, force it with r.Nanite=1 — but
; that triggers slow first-load Nanite builds on Metal, so only if truly warranted.

