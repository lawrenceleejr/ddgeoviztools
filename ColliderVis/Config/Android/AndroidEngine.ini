; Android / Meta Quest 3 standalone rendering overrides.
; These settings replace the corresponding DefaultEngine.ini values for Android builds.
; Tethered PCVR builds use DefaultEngine.ini directly (no overrides needed).

[/Script/Engine.RendererSettings]
; Quest 3's Snapdragon XR2 Gen 2 does not support Lumen or hardware ray tracing.
r.Lumen.Enabled=0
r.Lumen.HardwareRayTracing=0
r.Lumen.Reflections.Allow=0
r.Lumen.DiffuseIndirect.Allow=0
r.GenerateMeshDistanceFields=False
r.RayTracing=0

; Virtual Shadow Maps are PC-only; fall back to conventional cascaded shadow maps.
r.Shadow.Virtual.Enable=0

; Forward renderer is faster on mobile and required for MSAA in VR.
r.MobileShadingPath=0

; Mobile HDR is required for proper VR rendering on Android.
r.MobileHDR=1

; Multi-view stereo rendering — halves the draw call count for VR on Quest.
vr.MobileMultiView=1

; Disable PC-only post-process features that have no mobile equivalent.
r.Bloom=1
r.DepthOfField.Method=0
r.MotionBlur=0
r.PathTracing=0

; Use MSAA (4x) instead of TSR — TSR is not supported on mobile.
r.AntiAliasingMethod=2
r.MSAACount=4

; Pixel density — Quest 3 native resolution.  0.9 gives a small perf headroom.
vr.PixelDensity=0.9

; Disable expensive features not perceptible in VR at typical frame rates.
r.SSR.Quality=0
r.SSS.Scale=0
r.VolumetricFog=0

[/Script/Engine.Engine]
NearClipPlane=1.0
bUseVRFocus=True

[OpenXRHMD.Settings]
bEnableOpenXRHandTracking=True
