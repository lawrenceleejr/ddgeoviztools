name: Deploy web to GitHub Pages

# Builds the MAIA exploded-view site in web/ and publishes it to GitHub Pages.
#
# Repository setting (once): Settings → Pages → Source = "GitHub Actions".
# The configure-pages step below also sets that automatically on its first
# successful run.
#
# Deploying from a branch other than the default one additionally needs that
# branch added under Settings → Environments → github-pages → Deployment
# branches; GitHub restricts the github-pages environment to the default
# branch otherwise, and the deploy job fails on a protection rule.
on:
  push:
    branches:
      - main
      - claude/maia-exploded-view-webpage-c9t46h
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # `npm ci` installs the playwright package (used only by `npm run shots`
      # locally); its postinstall would otherwise download browsers here.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Rebuild the meshopt-packed GLBs from data/output/ so the published
      # site can never drift from the committed source geometry.
      - run: npm run models
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on (source = GitHub Actions) the first time this runs,
          # so the repository needs no manual Settings change.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
