name: Godot builds (macOS app + Linux)

# Exports the ColliderVis Godot project headlessly:
#   - a ready-to-run macOS .app (universal x86_64+arm64, ad-hoc signed),
#     published both as ColliderVis-macOS.zip and packaged into a proper
#     DMG (with an /Applications shortcut and a README explaining the
#     one-time quarantine removal) by a follow-on macOS job
#   - a Linux x86_64 binary
# plus a rendered verification screenshot so every build's lighting can be
# eyeballed straight from the artifacts page.
#
# The macOS app is ad-hoc signed (no Apple developer account needed). After
# installing from the DMG, clear the quarantine flag once:
#     xattr -cr /Applications/ColliderVis.app
on:
  push:
    paths:
      - "ColliderVisGodot/**"
      - ".github/workflows/godot-build.yml"
  workflow_dispatch:

# Supersede in-flight builds of the same branch so a rapid series of pushes
# doesn't tie up four runners each. (Manual dispatch uploads aren't cancelled
# mid-flight by a later push to a different ref.)
concurrency:
  group: godot-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable

      - name: Download Godot + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          curl -sSL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Bundle detector geometry
        run: cp gltf/*.gltf ColliderVisGodot/assets/detector/

      - name: Import project
        run: ~/godot-bin/godot --headless --path ColliderVisGodot --import || true

      - name: Export macOS app
        run: |
          mkdir -p ColliderVisGodot/build
          ~/godot-bin/godot --headless --path ColliderVisGodot \
            --export-release "macOS" build/ColliderVis-macOS.zip

      - name: Export Linux binary
        run: |
          ~/godot-bin/godot --headless --path ColliderVisGodot \
            --export-release "Linux" build/ColliderVis-Linux.x86_64

      # Upload the real deliverables BEFORE the smoke test so they are always
      # retrievable even if the (software-rendered) verification step is slow
      # or fails on a particular runner.
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: ColliderVis-macOS
          path: ColliderVisGodot/build/ColliderVis-macOS.zip

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: ColliderVis-Linux
          path: ColliderVisGodot/build/ColliderVis-Linux.x86_64

      # Render a few frames with the software Vulkan driver (lavapipe) as a
      # smoke test that the exported content actually loads and lights up.
      # Kept deliberately cheap: lavapipe is a CPU rasteriser, so we render
      # at a small resolution for a handful of frames. The screenshot path in
      # main.gd also forces native-scale bilinear (FSR2's compute pass is the
      # single most expensive thing on lavapipe) while keeping the baked
      # VoxelGI, so the frame still shows real lighting. stdbuf keeps Godot's
      # stdout line-buffered so progress is visible live in the CI log.
      - name: Verification render
        timeout-minutes: 12
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers xvfb
          chmod +x ColliderVisGodot/build/ColliderVis-Linux.x86_64
          timeout 540 xvfb-run -a -s "-screen 0 640x360x24" \
            stdbuf -oL -eL ColliderVisGodot/build/ColliderVis-Linux.x86_64 \
            --resolution 640x360 -- --screenshot=$PWD/verify.png --frames=6
          test -f verify.png

      - name: Upload verification render
        uses: actions/upload-artifact@v4
        with:
          name: verification-render
          path: verify.png

  # Package the .app into a real DMG with hdiutil. Runs on a macOS runner
  # so the disk image is a native compressed UDZO DMG, not an ISO knock-off.
  package-dmg:
    needs: export
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Download macOS app
        uses: actions/download-artifact@v4
        with:
          name: ColliderVis-macOS

      - name: Build DMG
        run: |
          set -euo pipefail
          mkdir dmg-root
          unzip -q ColliderVis-macOS.zip -d dmg-root
          ln -s /Applications dmg-root/Applications
          cat > "dmg-root/README — first launch.txt" <<'EOF'
          ColliderVis — photo-realistic HEP collision event display
          ==========================================================

          INSTALL
            Drag ColliderVis.app onto the Applications shortcut in this
            window (or any folder you like).

          FIRST LAUNCH (one-time step — please read)
            This app is signed with an ad-hoc signature, not an Apple
            Developer ID, so macOS Gatekeeper quarantines it on download.
            Clear the quarantine flag once from Terminal:

                xattr -cr /Applications/ColliderVis.app

            (If you copied the app somewhere else, use that path instead.)
            Then open the app normally. Alternatively: right-click the app
            → Open → Open, which works on some macOS versions without the
            Terminal step.

          CONTROLS
            Esc          menu (load EDM4HEP/JSON events, event index,
                         detector toggles, event information)
            Space        next event        B    previous event
            Tab          cycle camera: Orbit → Fly → Third person
            LMB / wheel  orbit / zoom      WASD move (Fly / Walk)
            1-9 / 0      toggle sub-detectors / show all
            C  [  ]      phi cutaway on/off, shrink/grow opening

          Loading EDM4HEP/key4hep .root files directly requires python3
          with `pip install uproot awkward` on this machine; converted
          event JSON files load with no dependencies.

          Project: https://github.com/lawrenceleejr/ddgeoviztools
          EOF
          hdiutil create -volname "ColliderVis" -srcfolder dmg-root \
            -ov -format UDZO ColliderVis-macOS.dmg
          # Sanity check: mount it and confirm the payload is intact.
          hdiutil attach ColliderVis-macOS.dmg -mountpoint /tmp/cvmount -nobrowse
          test -d "/tmp/cvmount/ColliderVis.app"
          test -f "/tmp/cvmount/README — first launch.txt"
          hdiutil detach /tmp/cvmount

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ColliderVis-macOS-dmg
          path: ColliderVis-macOS.dmg

  # Meta Quest: Android XR export (OpenXR vendors plugin + gradle build).
  # The vendors GDExtension has a known crash-on-exit during headless
  # export, so steps verify the artifact instead of trusting exit codes.
  quest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable

      - name: Download Godot + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          curl -sSL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Install OpenXR vendors addon
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/vendors.zip \
            "https://github.com/GodotVR/godot_openxr_vendors/releases/download/5.1.0-stable/godotopenxrvendorsaddon.zip"
          unzip -q /tmp/vendors.zip -d /tmp/vendors
          cp -r /tmp/vendors/asset/addons ColliderVisGodot/
          # Fail loudly if the zip layout changed and the addon didn't land —
          # otherwise gradle happily builds a valid-looking NON-XR APK.
          test -d ColliderVisGodot/addons/godotopenxrvendors \
            || { echo "ERROR: godotopenxrvendors addon missing after copy (zip layout changed?)"; exit 1; }
          test -f ColliderVisGodot/addons/godotopenxrvendors/plugin.cfg \
            || ls -R ColliderVisGodot/addons/godotopenxrvendors | head

      - name: Configure Android SDK + release keystore
        env:
          QUEST_KEYSTORE_B64: ${{ secrets.QUEST_KEYSTORE_B64 }}
          QUEST_KEYSTORE_ALIAS: ${{ secrets.QUEST_KEYSTORE_ALIAS }}
          QUEST_KEYSTORE_PASS: ${{ secrets.QUEST_KEYSTORE_PASS }}
        run: |
          # The signing certificate MUST stay identical across every build:
          # Meta locks an app to the certificate of its first uploaded APK,
          # and any later build signed with a different key is rejected
          # (the web uploader hangs at "validating package contents" rather
          # than erroring cleanly). Previously this step generated a fresh
          # random keystore on every run, so only the very first upload ever
          # succeeded — every build after it had a mismatched certificate.
          #
          # Now we use a stable key: the committed ColliderVisGodot/release.keystore
          # (alias/pass "collidervis") by default, or a keystore supplied via
          # repository secrets if you'd rather not use the committed one.
          if [ -n "$QUEST_KEYSTORE_B64" ]; then
            echo "$QUEST_KEYSTORE_B64" | base64 -d > ~/release.keystore
            KS_ALIAS="${QUEST_KEYSTORE_ALIAS:-collidervis}"
            KS_PASS="${QUEST_KEYSTORE_PASS:-collidervis}"
          else
            cp ColliderVisGodot/release.keystore ~/release.keystore
            KS_ALIAS="collidervis"
            KS_PASS="collidervis"
          fi
          # Print the certificate fingerprint so every build's signing key is
          # auditable from the CI log (it must match across builds).
          echo "--- signing certificate ---"
          keytool -list -v -keystore ~/release.keystore -storepass "$KS_PASS" \
            2>/dev/null | grep -E "Alias|SHA256:" || true
          # Expose alias/pass to subsequent steps via GITHUB_ENV.
          # The keystore file itself lives at ~/release.keystore for the
          # lifetime of this job runner.
          echo "KS_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          echo "KS_PASS=$KS_PASS"   >> "$GITHUB_ENV"
          mkdir -p ~/.config/godot
          # Editor settings: covers the debug path and gives Godot the SDK
          # location; the release keystore is injected directly into the
          # preset below (Godot headless does not fall back to editor settings
          # for release exports, only debug).
          cat > ~/.config/godot/editor_settings-4.6.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          export/android/debug_keystore = "$HOME/release.keystore"
          export/android/debug_keystore_user = "$KS_ALIAS"
          export/android/debug_keystore_pass = "$KS_PASS"
          EOF

      - name: Bundle detector geometry (decimated for Quest)
        run: |
          # The raw detector is ~1.9M triangles of CAD-derived geometry — far
          # too heavy for a standalone Quest GPU (it ran at ~2 fps). gltfpack's
          # aggressive simplifier (-sa) crushes it to ~8% (~155k tris),
          # collapsing even the disconnected calorimeter cells, and emits no
          # glTF extension Godot can't import (-noq, no compression). Desktop
          # builds keep the full-resolution mesh.
          curl -sSL -o /tmp/gp.zip "https://github.com/zeux/meshoptimizer/releases/download/v0.20/gltfpack-ubuntu.zip"
          unzip -oq /tmp/gp.zip -d /tmp/gp && chmod +x /tmp/gp/gltfpack
          mkdir -p ColliderVisGodot/assets/detector
          for f in gltf/*.gltf; do
            b=$(basename "$f" .gltf)
            /tmp/gp/gltfpack -i "$f" -o "ColliderVisGodot/assets/detector/$b.glb" -si 0.1 -sa -noq
          done
          echo "Decimated detector files:"
          ls -la ColliderVisGodot/assets/detector/*.glb | awk '{print $5, $9}'

      - name: Import project
        run: ~/godot-bin/godot --headless --path ColliderVisGodot --import || true

      - name: Export Quest APK
        run: |
          mkdir -p ColliderVisGodot/build
          # Meta requires a strictly higher Android version code on every
          # upload. Fold in run_attempt so a *re-run* of the same workflow
          # (which reuses GITHUB_RUN_NUMBER) still bumps the code instead of
          # colliding. Offset keeps it above any earlier manual upload.
          VCODE=$(( 1000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))
          sed -i "s|^version/code=.*|version/code=${VCODE}|" ColliderVisGodot/export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"1.0.${GITHUB_RUN_NUMBER}\"|" ColliderVisGodot/export_presets.cfg
          # Inject the release keystore into the preset — Godot's
          # --export-release reads keystore/release from the preset, not
          # from editor settings (the editor-settings fallback only covers
          # the debug keystore).
          sed -i "s|^keystore/release=\"\"|keystore/release=\"$HOME/release.keystore\"|" ColliderVisGodot/export_presets.cfg
          sed -i "s|^keystore/release_user=\"\"|keystore/release_user=\"$KS_ALIAS\"|" ColliderVisGodot/export_presets.cfg
          sed -i "s|^keystore/release_password=\"\"|keystore/release_password=\"$KS_PASS\"|" ColliderVisGodot/export_presets.cfg
          echo "Quest version code: ${VCODE}"
          # IMPORTANT: --install-android-build-template MUST be on the same
          # Godot command line as --export-release. As a standalone flag in
          # a separate invocation, Godot in --headless mode falls through to
          # running the project (which hangs forever on no display), instead
          # of installing the template and exiting. The vendors plugin runs
          # as part of the export pipeline triggered by --export-release and
          # injects the required Meta manifest entries.
          ~/godot-bin/godot --headless --path ColliderVisGodot \
            --install-android-build-template \
            --export-release "Quest" build/ColliderVis-Quest.apk || true
          test -f ColliderVisGodot/build/ColliderVis-Quest.apk
          APK=ColliderVisGodot/build/ColliderVis-Quest.apk

          # ── Manifest post-patch ───────────────────────────────────────────
          # Two Meta requirements Godot/the vendors plugin can't satisfy on
          # their own, fixed by decoding the APK with apktool, editing the
          # manifest, rebuilding, and re-signing with the same release key:
          #   1. android:excludeFromRecents="true" on the *launching* activity.
          #      Godot's launcher is an <activity-alias> and Godot only writes
          #      excludeFromRecents onto the target <activity>, never the alias.
          #   2. android.hardware.vr.headtracking android:required="true".
          #      With boundary mode Enabled (standard Guardian app, not
          #      boundaryless) the vendors plugin ships required="false"; Meta
          #      requires "true", so we flip it here.
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          curl -sSL -o /tmp/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar"
          rm -rf /tmp/dec
          java -jar /tmp/apktool.jar d -f -s -o /tmp/dec "$APK"
          MAN=/tmp/dec/AndroidManifest.xml
          # Patch 1: excludeFromRecents on the launcher alias (Godot only sets
          # it on the target activity). Then ASSERT it took — a silent no-op
          # from a manifest-format change must fail the build, not ship.
          grep -q 'activity-alias[^>]*excludeFromRecents' "$MAN" \
            || sed -i 's|<activity-alias |<activity-alias android:excludeFromRecents="true" |' "$MAN"
          grep -q 'activity-alias[^>]*android:excludeFromRecents="true"' "$MAN" \
            || { echo "ERROR: excludeFromRecents patch did not apply (manifest format changed?)"; exit 1; }
          # Patch 2: headtracking required=true. Assert it, too.
          sed -i '/android.hardware.vr.headtracking/ s/android:required="false"/android:required="true"/' "$MAN"
          grep -q 'android.hardware.vr.headtracking[^/]*android:required="true"' "$MAN" \
            || { echo "ERROR: headtracking required=true not present after patch"; exit 1; }
          java -jar /tmp/apktool.jar b /tmp/dec -o /tmp/cv_patched.apk --use-aapt2
          test -s /tmp/cv_patched.apk || { echo "ERROR: apktool rebuild produced no APK"; exit 1; }
          "$BT/zipalign" -p -f 4 /tmp/cv_patched.apk "$APK"
          # Re-sign with the stable release key. v2 scheme only (v3 disabled):
          # Meta validates against v1/v2, and a v3-only signature reads as
          # "v2=false" to Meta's checker.
          "$BT/apksigner" sign \
            --ks "$HOME/release.keystore" --ks-pass pass:"$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" --key-pass pass:"$KS_PASS" \
            --v2-signing-enabled true --v3-signing-enabled false --v4-signing-enabled false \
            "$APK"

          # ---- Hard validation on the FINAL signed APK (NEVER skippable) ----
          # aapt is mandatory: if it's missing we fail rather than ship an
          # unvalidated APK.
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1)
          [ -n "$AAPT" ] || { echo "ERROR: aapt not found in build-tools — cannot validate APK"; exit 1; }
          TREE=$("$AAPT" dump xmltree "$APK" AndroidManifest.xml 2>/dev/null)
          BADGING=$("$AAPT" dump badging "$APK" 2>/dev/null)
          echo "$BADGING" | grep -oE "versionCode='[0-9]*'|sdkVersion:'[0-9]*'|targetSdkVersion:'[0-9]*'" || true
          MINSDK=$(echo "$BADGING" | grep -oE "sdkVersion:'[0-9]*'" | grep -oE "[0-9]+")
          [ "${MINSDK:-0}" -ge 29 ] || { echo "ERROR: minSdkVersion ${MINSDK:-?} < 29 — Meta rejects."; exit 1; }
          # vr.headtracking must be PRESENT and required=true (0xffffffff).
          # An absent attribute (empty match) must fail, not pass.
          HT=$(echo "$TREE" | grep -A1 'android.hardware.vr.headtracking' | grep -oE '0x[0-9a-f]+$' | head -1)
          echo "headtracking required = ${HT:-<absent>}"
          [ "$HT" = "0xffffffff" ] || { echo "ERROR: vr.headtracking not required=true (got ${HT:-absent})"; exit 1; }
          # launcher activity-alias excludeFromRecents=true
          ALIAS_EFR=$(echo "$TREE" | sed -n '/E: activity-alias/,/E: intent-filter/p' | grep -o 'excludeFromRecents.*0x[0-9a-f]*' | grep -o '0x[0-9a-f]*$' | head -1)
          echo "alias excludeFromRecents = ${ALIAS_EFR:-<absent>}"
          [ "$ALIAS_EFR" = "0xffffffff" ] || { echo "ERROR: launcher alias excludeFromRecents not true (${ALIAS_EFR:-absent})"; exit 1; }
          # Must actually BE a Meta VR app + carry the OpenXR runtime, or the
          # vendors addon silently didn't apply and we'd ship a non-XR APK.
          echo "$TREE" | grep -q 'com.oculus.intent.category.VR' \
            || { echo "ERROR: com.oculus.intent.category.VR missing — not a VR app (vendors addon not applied?)"; exit 1; }
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libopenxr_loader.so' \
            || { echo "ERROR: libopenxr_loader.so missing from APK — OpenXR runtime not bundled"; exit 1; }
          echo "--- validated Meta manifest entries ---"
          echo "$TREE" | grep -E '(oculus|supportedDevices|headtracking)' || true
          # Confirm the APK is signed with v2 (Meta requires v1 or v2) and
          # print the signing certificate digest — it MUST be identical on
          # every build, or Meta rejects/hangs the upload.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            echo "--- APK signature schemes + certificate ---"
            "$APKSIGNER" verify --verbose --print-certs \
              ColliderVisGodot/build/ColliderVis-Quest.apk \
              | grep -iE "scheme v[0-9]|SHA-256 digest" || true
          fi

      - name: Upload Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: ColliderVis-Quest
          path: ColliderVisGodot/build/ColliderVis-Quest.apk

      # Push the freshly-built APK straight to Meta Horizon with Meta's own
      # command-line uploader (ovr-platform-util), bypassing the web
      # uploader whose "validating package contents" step is a known black
      # box that hangs without a clear error. This runs ONLY when you start
      # the workflow manually (Actions → Run workflow) AND you have set the
      # META_APP_ID / META_APP_SECRET repository secrets — normal pushes
      # just build the artifact, they never upload.
      # App ID and secret come from your app's API tab in the Meta dashboard.
      - name: Check for Meta upload credentials
        id: metacreds
        if: github.event_name == 'workflow_dispatch'
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          if [ -n "$META_APP_ID" ] && [ -n "$META_APP_SECRET" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "META_APP_ID / META_APP_SECRET not set — skipping upload."
          fi

      - name: Set up ovr-platform-util
        if: steps.metacreds.outputs.have == 'true'
        uses: RageAgainstThePixel/setup-ovr-platform-util@v1

      - name: Upload build to Meta Horizon (ALPHA channel)
        if: steps.metacreds.outputs.have == 'true'
        run: |
          ovr-platform-util upload-quest-build \
            --app-id "${{ secrets.META_APP_ID }}" \
            --app-secret "${{ secrets.META_APP_SECRET }}" \
            --apk ColliderVisGodot/build/ColliderVis-Quest.apk \
            --channel ALPHA \
            --age-group TEENS_AND_ADULTS \
            --notes "CI build ${{ github.run_number }}"

  # iOS (iPhone + iPad): export the Xcode project, compile it unsigned on a
  # macOS runner. The unsigned IPA can be sideloaded (AltStore/Sideloadly)
  # or the Xcode project opened and signed with your own Apple ID.
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot (macOS) + export templates
        id: cache-godot-mac
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-mac
            ~/Library/Application Support/Godot/export_templates
          key: godot-mac-${{ env.GODOT_VERSION }}-stable

      - name: Download Godot + export templates
        if: steps.cache-godot-mac.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-mac
          curl -sSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q /tmp/godot.zip -d ~/godot-mac
          curl -sSL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Bundle detector geometry (decimated for iOS)
        run: |
          # Phones/tablets need the same drastic decimation as the Quest: the
          # raw ~1.9M-tri detector is crushed to ~8% (~155k tris) with
          # gltfpack's aggressive simplifier. (macOS desktop build keeps full.)
          curl -sSL -o /tmp/gp.zip "https://github.com/zeux/meshoptimizer/releases/download/v0.20/gltfpack-macos.zip"
          unzip -oq /tmp/gp.zip -d /tmp/gp && chmod +x /tmp/gp/gltfpack
          xattr -dr com.apple.quarantine /tmp/gp/gltfpack 2>/dev/null || true
          mkdir -p ColliderVisGodot/assets/detector
          for f in gltf/*.gltf; do
            b=$(basename "$f" .gltf)
            /tmp/gp/gltfpack -i "$f" -o "ColliderVisGodot/assets/detector/$b.glb" -si 0.1 -sa -noq
          done
          ls -la ColliderVisGodot/assets/detector/*.glb | awk '{print $5, $9}'

      - name: Import project
        run: ~/godot-mac/Godot.app/Contents/MacOS/Godot --headless --path ColliderVisGodot --import || true

      - name: Export iOS Xcode project
        run: |
          mkdir -p ColliderVisGodot/build/ios
          ~/godot-mac/Godot.app/Contents/MacOS/Godot --headless --path ColliderVisGodot \
            --export-release "iOS" build/ios/ColliderVis.ipa 2>&1 | tee /tmp/ios_export.log || true
          # The export must not have raised export errors, and the pbxproj
          # must be a complete, parseable plist (a failed export leaves a
          # damaged project behind).
          ! grep -q 'Project export for preset "iOS" failed' /tmp/ios_export.log
          plutil -lint ColliderVisGodot/build/ios/ColliderVis.xcodeproj/project.pbxproj

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          cd ColliderVisGodot/build/ios
          xcodebuild -project ColliderVis.xcodeproj -scheme ColliderVis \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/out" build
          mkdir Payload
          cp -r out/*.app Payload/
          zip -qry ColliderVis-iOS-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ColliderVis-iOS-unsigned
          path: ColliderVisGodot/build/ios/ColliderVis-iOS-unsigned.ipa

      - name: Zip Xcode project
        run: |
          cd ColliderVisGodot/build/ios
          zip -qry ColliderVis-Xcode.zip ColliderVis.xcodeproj ColliderVis ColliderVis.pck \
            ColliderVis.xcframework MoltenVK.xcframework PrivacyInfo.xcprivacy || \
          zip -qry ColliderVis-Xcode.zip .

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: ColliderVis-iOS-XcodeProject
          path: ColliderVisGodot/build/ios/ColliderVis-Xcode.zip
