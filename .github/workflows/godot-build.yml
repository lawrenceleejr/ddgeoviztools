name: Godot builds (macOS app + Linux)

# Exports the ColliderVis Godot project headlessly:
#   - a ready-to-run macOS .app (universal x86_64+arm64, ad-hoc signed),
#     published both as ColliderVis-macOS.zip and packaged into a proper
#     DMG (with an /Applications shortcut and a README explaining the
#     one-time quarantine removal) by a follow-on macOS job
#   - a Linux x86_64 binary
# plus a rendered verification screenshot so every build's lighting can be
# eyeballed straight from the artifacts page.
#
# The macOS app is ad-hoc signed (no Apple developer account needed). After
# installing from the DMG, clear the quarantine flag once:
#     xattr -cr /Applications/ColliderVis.app
on:
  push:
    paths:
      - "ColliderVisGodot/**"
      - ".github/workflows/godot-build.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable

      - name: Download Godot + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          curl -sSL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Bundle detector geometry
        run: cp gltf/*.gltf ColliderVisGodot/assets/detector/

      - name: Import project
        run: ~/godot-bin/godot --headless --path ColliderVisGodot --import || true

      - name: Export macOS app
        run: |
          mkdir -p ColliderVisGodot/build
          ~/godot-bin/godot --headless --path ColliderVisGodot \
            --export-release "macOS" build/ColliderVis-macOS.zip

      - name: Export Linux binary
        run: |
          ~/godot-bin/godot --headless --path ColliderVisGodot \
            --export-release "Linux" build/ColliderVis-Linux.x86_64

      # Render one frame with the software Vulkan driver (lavapipe) as a
      # smoke test that the exported content actually loads and lights up.
      - name: Verification render
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers xvfb
          chmod +x ColliderVisGodot/build/ColliderVis-Linux.x86_64
          # 25 frames: VoxelGI needs no temporal convergence (unlike SDFGI),
          # and per-frame cone tracing is expensive on software Vulkan.
          timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" \
            ColliderVisGodot/build/ColliderVis-Linux.x86_64 \
            --resolution 1280x720 -- --screenshot=$PWD/verify.png --frames=25
          test -f verify.png

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: ColliderVis-macOS
          path: ColliderVisGodot/build/ColliderVis-macOS.zip

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: ColliderVis-Linux
          path: ColliderVisGodot/build/ColliderVis-Linux.x86_64

      - name: Upload verification render
        uses: actions/upload-artifact@v4
        with:
          name: verification-render
          path: verify.png

  # Package the .app into a real DMG with hdiutil. Runs on a macOS runner
  # so the disk image is a native compressed UDZO DMG, not an ISO knock-off.
  package-dmg:
    needs: export
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Download macOS app
        uses: actions/download-artifact@v4
        with:
          name: ColliderVis-macOS

      - name: Build DMG
        run: |
          set -euo pipefail
          mkdir dmg-root
          unzip -q ColliderVis-macOS.zip -d dmg-root
          ln -s /Applications dmg-root/Applications
          cat > "dmg-root/README — first launch.txt" <<'EOF'
          ColliderVis — photo-realistic HEP collision event display
          ==========================================================

          INSTALL
            Drag ColliderVis.app onto the Applications shortcut in this
            window (or any folder you like).

          FIRST LAUNCH (one-time step — please read)
            This app is signed with an ad-hoc signature, not an Apple
            Developer ID, so macOS Gatekeeper quarantines it on download.
            Clear the quarantine flag once from Terminal:

                xattr -cr /Applications/ColliderVis.app

            (If you copied the app somewhere else, use that path instead.)
            Then open the app normally. Alternatively: right-click the app
            → Open → Open, which works on some macOS versions without the
            Terminal step.

          CONTROLS
            Esc          menu (load EDM4HEP/JSON events, event index,
                         detector toggles, event information)
            Space        next event        B    previous event
            Tab          cycle camera: Orbit → Fly → Third person
            LMB / wheel  orbit / zoom      WASD move (Fly / Walk)
            1-9 / 0      toggle sub-detectors / show all
            C  [  ]      phi cutaway on/off, shrink/grow opening

          Loading EDM4HEP/key4hep .root files directly requires python3
          with `pip install uproot awkward` on this machine; converted
          event JSON files load with no dependencies.

          Project: https://github.com/lawrenceleejr/ddgeoviztools
          EOF
          hdiutil create -volname "ColliderVis" -srcfolder dmg-root \
            -ov -format UDZO ColliderVis-macOS.dmg
          # Sanity check: mount it and confirm the payload is intact.
          hdiutil attach ColliderVis-macOS.dmg -mountpoint /tmp/cvmount -nobrowse
          test -d "/tmp/cvmount/ColliderVis.app"
          test -f "/tmp/cvmount/README — first launch.txt"
          hdiutil detach /tmp/cvmount

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ColliderVis-macOS-dmg
          path: ColliderVis-macOS.dmg

  # Meta Quest: Android XR export (OpenXR vendors plugin + gradle build).
  # The vendors GDExtension has a known crash-on-exit during headless
  # export, so steps verify the artifact instead of trusting exit codes.
  quest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable

      - name: Download Godot + export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          curl -sSL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Install OpenXR vendors addon
        run: |
          curl -sSL -o /tmp/vendors.zip \
            "https://github.com/GodotVR/godot_openxr_vendors/releases/download/5.1.0-stable/godotopenxrvendorsaddon.zip"
          unzip -q /tmp/vendors.zip -d /tmp/vendors
          cp -r /tmp/vendors/asset/addons ColliderVisGodot/

      - name: Configure Android SDK + debug keystore
        run: |
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.6.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Bundle detector geometry
        run: cp gltf/*.gltf ColliderVisGodot/assets/detector/

      - name: Import project
        run: ~/godot-bin/godot --headless --path ColliderVisGodot --import || true

      - name: Export Quest APK
        run: |
          mkdir -p ColliderVisGodot/build
          # Meta requires a higher Android version code on every upload.
          # Stamp a unique, monotonically-increasing code from the CI run
          # number (offset so it's safely above any earlier manual upload).
          VCODE=$(( 1000 + GITHUB_RUN_NUMBER ))
          sed -i "s|^version/code=.*|version/code=${VCODE}|" ColliderVisGodot/export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"1.0.${GITHUB_RUN_NUMBER}\"|" ColliderVisGodot/export_presets.cfg
          echo "Quest version code: ${VCODE}"
          ~/godot-bin/godot --headless --path ColliderVisGodot \
            --install-android-build-template \
            --export-debug "Quest" build/ColliderVis-Quest.apk || true
          test -f ColliderVisGodot/build/ColliderVis-Quest.apk
          # Confirm the manifest carries the bumped code (informational only;
          # pick a single aapt — the glob matches several build-tools dirs —
          # and never fail the build on the check itself).
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1)
          [ -n "$AAPT" ] && "$AAPT" dump badging \
            ColliderVisGodot/build/ColliderVis-Quest.apk \
            | grep -o "versionCode='[0-9]*'" || true

      - name: Upload Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: ColliderVis-Quest
          path: ColliderVisGodot/build/ColliderVis-Quest.apk

  # iOS (iPhone + iPad): export the Xcode project, compile it unsigned on a
  # macOS runner. The unsigned IPA can be sideloaded (AltStore/Sideloadly)
  # or the Xcode project opened and signed with your own Apple ID.
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot (macOS) + export templates
        id: cache-godot-mac
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-mac
            ~/Library/Application Support/Godot/export_templates
          key: godot-mac-${{ env.GODOT_VERSION }}-stable

      - name: Download Godot + export templates
        if: steps.cache-godot-mac.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-mac
          curl -sSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q /tmp/godot.zip -d ~/godot-mac
          curl -sSL -o /tmp/templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Bundle detector geometry
        run: cp gltf/*.gltf ColliderVisGodot/assets/detector/

      - name: Import project
        run: ~/godot-mac/Godot.app/Contents/MacOS/Godot --headless --path ColliderVisGodot --import || true

      - name: Export iOS Xcode project
        run: |
          mkdir -p ColliderVisGodot/build/ios
          ~/godot-mac/Godot.app/Contents/MacOS/Godot --headless --path ColliderVisGodot \
            --export-release "iOS" build/ios/ColliderVis.ipa 2>&1 | tee /tmp/ios_export.log || true
          # The export must not have raised export errors, and the pbxproj
          # must be a complete, parseable plist (a failed export leaves a
          # damaged project behind).
          ! grep -q 'Project export for preset "iOS" failed' /tmp/ios_export.log
          plutil -lint ColliderVisGodot/build/ios/ColliderVis.xcodeproj/project.pbxproj

      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          cd ColliderVisGodot/build/ios
          xcodebuild -project ColliderVis.xcodeproj -scheme ColliderVis \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR="$PWD/out" build
          mkdir Payload
          cp -r out/*.app Payload/
          zip -qry ColliderVis-iOS-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ColliderVis-iOS-unsigned
          path: ColliderVisGodot/build/ios/ColliderVis-iOS-unsigned.ipa

      - name: Zip Xcode project
        run: |
          cd ColliderVisGodot/build/ios
          zip -qry ColliderVis-Xcode.zip ColliderVis.xcodeproj ColliderVis ColliderVis.pck \
            ColliderVis.xcframework MoltenVK.xcframework PrivacyInfo.xcprivacy || \
          zip -qry ColliderVis-Xcode.zip .

      - name: Upload Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: ColliderVis-iOS-XcodeProject
          path: ColliderVisGodot/build/ios/ColliderVis-Xcode.zip
