name: Web deploy (bake + Pages)

# Builds the interactive web viewer and deploys it to GitHub Pages.
#
# Pipeline (starts from the committed sub-detector GLTFs — no GDML step):
#   web/public/models/*.gltf
#     -> blender-scene  (build the .blend: materials + lights + phi cutaway)
#     -> Cycles bake    (scripts/bake_lightmaps.py -> detector_baked.glb)
#     -> vite build     (three.js app, picks up the baked GLB)
#     -> GitHub Pages
#
# The bake is cached on a hash of its inputs, so routine pushes that don't touch
# the geometry / Blender / bake scripts reuse the previous bake and deploy fast.
#
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions". Deploying
# from a non-default branch may also require allowing it on the github-pages
# environment (Settings -> Environments -> github-pages -> Deployment branches).

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reuse a previous bake unless the geometry / Blender / bake inputs changed.
      - name: Cache baked detector
        id: bake
        uses: actions/cache@v4
        with:
          path: web/public/baked
          key: baked-${{ hashFiles('web/public/models/**', 'scripts/bake_lightmaps.py', 'scripts/bake_web.sh', 'src/gdml_to_blender.py', 'Dockerfile', 'requirements.txt') }}

      - name: Set up Docker Buildx
        if: steps.bake.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build ddgeoviztools image
        if: steps.bake.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ddgeoviztools
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bake lighting (GLTF -> blender-scene -> Cycles -> GLB)
        if: steps.bake.outputs.cache-hit != 'true'
        run: bash scripts/bake_web.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build web app
        run: npm run build
        working-directory: web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
